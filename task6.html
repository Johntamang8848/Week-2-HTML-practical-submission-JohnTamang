<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Student Registration Form</title>
</head>

<body>

  <h1>Student Registration Form</h1>

  <form action="#" method="post">

    <!-- Text input -->
    <label for="name">Name:</label><br>
    <input type="text" id="name" name="name" placeholder="Enter your full name" required><br><br>

    <!-- Email input -->
    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" placeholder="you@example.com" required><br><br>

    <!-- Password input -->
    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password" required><br><br>

    <!-- Radio buttons: only one option can be selected -->
    <fieldset>
      <legend>Gender</legend>
      <input type="radio" id="male" name="gender" value="male">
      <label for="male">Male</label><br>
      <input type="radio" id="female" name="gender" value="female">
      <label for="female">Female</label><br>
      <input type="radio" id="other" name="gender" value="other">
      <label for="other">Other</label>
    </fieldset><br>

    <!-- Checkboxes: multiple options can be selected -->
    <fieldset>
      <legend>Interests</legend>
      <input type="checkbox" id="reading" name="interests" value="reading">
      <label for="reading">Reading</label><br>
      <input type="checkbox" id="sports" name="interests" value="sports">
      <label for="sports">Sports</label><br>
      <input type="checkbox" id="research" name="interests" value="research">
      <label for="research">Research</label>
    </fieldset><br>

    <!-- Dropdown selection -->
    <label for="department">Department:</label><br>
    <select id="department" name="department">
      <option value="Digital Marketing">Digital Marketing</option>
      <option value="Business Analytics">Business Analytics</option>
      <option value="Software Engineering">Software Engineering</option>
      <option value="Cybersecurity">Cybersecurity</option>
    </select><br><br>

    <!-- Textarea for longer free-form text -->
    <label for="about">About You:</label><br>
    <textarea id="about" name="about" rows="4" cols="40" placeholder="Tell us a bit about yourself"></textarea><br><br>

    <button type="submit">Submit</button>

  </form>

</body>

</html>
