<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>John's Portfolio - Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Contact Me</h1>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <main>
    <section>
      <h2>Get In Touch</h2>
      <form action="#" method="post">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4" cols="40"></textarea><br><br>

        <button type="submit">Send</button>
      </form>
    </section>

    <section>
      <h2>Find Us</h2>
      <!-- Embedded Google Map, satisfying the "embed a video or map" requirement -->
      <iframe
        src="https://www.google.com/maps?q=PCPS+College+Kupondole&output=embed"
        width="400" height="300" style="border:0;" allowfullscreen loading="lazy">
      </iframe>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 John. All rights reserved.</p>
  </footer>

</body>
</html>
